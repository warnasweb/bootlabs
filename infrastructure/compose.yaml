services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bootlabs
      POSTGRES_USER: bootlabs
      POSTGRES_PASSWORD: bootlabs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootlabs -d bootlabs"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - bootlabs-postgres:/var/lib/postgresql
volumes:
  bootlabs-postgres:
